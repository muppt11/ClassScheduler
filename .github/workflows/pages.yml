# Builds the website and publishes it to GitHub Pages on every push to main.
# The app runs entirely in the browser; department spreadsheets are never part of it.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test RoomScheduler.slnx

      - name: Publish
        run: dotnet publish src/RoomScheduler.Web -c Release -o out

      - name: Prepare for GitHub Pages
        run: |
          cd out/wwwroot
          # The site lives under /<repository>/, not the domain root.
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          rm -f index.html.br index.html.gz
          # Deep links like /rooms load the app, which then shows the right page.
          cp index.html 404.html
          # Serve the _framework folder as is.
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
