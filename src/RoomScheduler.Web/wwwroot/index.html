<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomScheduler</title>
    <!-- The GitHub Pages build rewrites this to the repository path. -->
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="RoomScheduler.Web.styles.css" />
</head>

<body>
    <div id="app">
        <div class="loading">Loading RoomScheduler…</div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">Close</span>
    </div>

    <script>
        window.scheduleTutorial = (() => {
            const key = "roomscheduler:tutorial:v1";
            let dismissed = false;
            const remember = () => {
                dismissed = true;
                try { localStorage.setItem(key, "seen"); } catch { /* The guide still works without storage. */ }
            };
            return {
                firstVisit(dialog) {
                    dialog.addEventListener("cancel", remember);
                    dialog.addEventListener("close", () => document.querySelector(".tutorial-launch")?.focus());
                    let seen = dismissed;
                    try { seen ||= localStorage.getItem(key) === "seen"; } catch { }
                    if (!seen) dialog.showModal();
                },
                open(dialog) { if (!dialog.open) dialog.showModal(); },
                dismiss(dialog) { remember(); dialog.close(); }
            };
        })();
        window.scrollChatToBottom = element => { element.scrollTop = element.scrollHeight; };
        // Saves bytes from the app as a file, used for spreadsheet exports.
        window.saveFile = (name, base64, type) => {
            const link = document.createElement("a");
            link.href = "data:" + (type || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet") + ";base64," + base64;
            link.download = name;
            link.click();
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
